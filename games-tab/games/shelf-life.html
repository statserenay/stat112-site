<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf Life: The Tableau Challenge · STAT 112</title>
<style>
:root{
  --navy:#0f1b33; --navy2:#1a2a4d; --ink:#1d2433; --muted:#6b7487; --line:#d9dee8; --bg:#f4f6fb;
  --blue:#2f6fde; --dim:#3b78c4; --dimbg:#e3eefb; --mea:#2f9a5a; --meabg:#e2f4e9;
  --ok:#1f9d55; --bad:#d64545; --gold:#f2b632; --card:#fff; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.hud .logo{font-weight:800;letter-spacing:.02em}
.hud .logo span{color:var(--gold)}
.hud .round{opacity:.85;font-size:.9rem}
.hud .grow{flex:1}
.hud .score{background:var(--navy2);padding:4px 12px;border-radius:999px;font-weight:700}
.hud .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;font-size:.85rem}
.progress{height:4px;background:#dfe4ee}
.progress > div{height:100%;background:var(--gold);width:0;transition:width .3s}
main{max-width:1180px;margin:0 auto;padding:18px}
h1,h2,h3{margin:.2em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:#e8ecf4;color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:.95rem}
.feedback.ok{background:#e5f6ec;border:1px solid #b9e4c9}
.feedback.bad{background:#fdecec;border:1px solid #f3c2c2}
.feedback.info{background:#eef3fd;border:1px solid #cddbf7}
kbd{background:#eef1f6;border:1px solid #cfd5e1;border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.85em}
/* ---------- Start ---------- */
.hero{background:linear-gradient(135deg,var(--navy),#22407a);color:#fff;border-radius:16px;padding:34px 30px;position:relative;overflow:hidden}
.hero h1{font-size:2.3rem;margin:0}
.hero h1 span{color:var(--gold)}
.hero p{max-width:640px;opacity:.92}
.hero .bars{position:absolute;right:30px;bottom:0;display:flex;gap:10px;align-items:flex-end;opacity:.9}
.hero .bars i{display:block;width:26px;background:#4b8bf0;border-radius:4px 4px 0 0}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.rcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,27,51,.08)}
.rcard .num{font-size:.75rem;font-weight:800;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.rcard b{font-size:1.08rem}
.rcard .best{font-size:.8rem;color:var(--muted)}
/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:600;font-size:.88rem;border:1px solid transparent;user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap}
.pill .ic{font-size:.72rem;font-weight:800;opacity:.85;min-width:1.4em;text-align:center}
.pill.dim{background:var(--dimbg);color:#174a85;border-color:#b9d2f1}
.pill.mea{background:var(--meabg);color:#17643a;border-color:#b5e0c5}
.pill.on-shelf.dim{background:var(--dim);color:#fff}
.pill.on-shelf.mea{background:var(--mea);color:#fff}
.pill.selected{outline:3px solid var(--gold);outline-offset:2px}
.pill.src{cursor:grab}
.pill.on-shelf{cursor:pointer}
.pill .pct{background:rgba(255,255,255,.25);border-radius:4px;padding:0 4px;font-size:.75rem}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.2)}
/* ---------- Round 1: sorter ---------- */
.sorter{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;align-items:stretch;margin-top:12px}
.bin{border:2px dashed var(--line);border-radius:14px;padding:14px;min-height:260px;background:#fff;display:flex;flex-direction:column;gap:8px;transition:background .15s,border-color .15s}
.bin h3{margin:0;font-size:1rem}
.bin.dimbin h3{color:var(--dim)} .bin.meabin h3{color:var(--mea)}
.bin .list{display:flex;flex-wrap:wrap;gap:6px}
.bin.hot{background:#fff9e6;border-color:var(--gold)}
.bin button.pickbin{margin-top:auto}
.fieldcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:center}
.fieldcard .big{font-size:1.5rem;font-weight:800}
.fieldcard .typeic{font-size:1rem;background:#eef1f6;border-radius:8px;padding:2px 10px;font-weight:800}
.fieldcard .ctx{color:var(--muted);font-size:.9rem;max-width:320px}
.fieldcard .drag-me{cursor:grab;touch-action:none;padding:12px 22px;border-radius:999px;background:var(--navy);color:#fff;font-weight:800;font-size:1.1rem;user-select:none}
/* ---------- Round 2: workspace tour ---------- */
.tour-q{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tour-q .q{font-size:1.1rem;font-weight:700;flex:1;min-width:260px}
.ws{border:1px solid #c7cedb;border-radius:12px;overflow:hidden;background:#fff;font-size:.8rem;user-select:none}
.ws .hs{cursor:pointer;position:relative;transition:box-shadow .15s,background .15s}
.ws .hs:hover{box-shadow:inset 0 0 0 2px rgba(47,111,222,.55)}
.ws .hs.right{box-shadow:inset 0 0 0 3px var(--ok)!important;background:#e9f8ef!important}
.ws .hs.wrong{box-shadow:inset 0 0 0 3px var(--bad)!important;background:#fdeeee!important}
.ws .hs.reveal{box-shadow:inset 0 0 0 3px var(--gold)!important;background:#fff6dc!important}
.ws-menu{display:flex;gap:2px;background:#f1f3f7;border-bottom:1px solid #dde2ea;padding:3px 8px;flex-wrap:wrap}
.ws-menu span{padding:2px 8px;border-radius:4px}
.ws-tools{display:flex;gap:4px;align-items:center;padding:5px 8px;border-bottom:1px solid #dde2ea;flex-wrap:wrap}
.ws-tools .tb{padding:3px 8px;border:1px solid #dfe3ea;border-radius:5px;background:#fafbfd}
.ws-tools .sep{width:1px;height:20px;background:#dde2ea;margin:0 4px}
.ws-body{display:grid;grid-template-columns:170px 150px 1fr 150px;min-height:330px}
.ws-col{border-right:1px solid #e3e7ee;display:flex;flex-direction:column}
.ws-box{padding:6px 8px;border-bottom:1px solid #e3e7ee}
.ws-box .t{font-weight:700;font-size:.75rem;color:#525c70;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.ws-box .f{padding:1px 0;color:#344}
.ws-box .f.d{color:#1f5ea8} .ws-box .f.m{color:#1d7a45}
.ws-shelf{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #e3e7ee}
.ws-shelf .t{width:62px;font-weight:700;color:#525c70}
.ws-shelf .slot{flex:1;height:22px;border:1px dashed #cfd5e1;border-radius:5px}
.ws-canvas{flex:1;display:grid;place-items:center;color:#9aa3b5;font-size:.9rem;min-height:200px}
.ws-showme .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ws-showme .grid i{display:block;height:26px;background:#eef2f8;border-radius:4px}
.ws-tabs{display:flex;gap:2px;border-top:1px solid #dde2ea;background:#f1f3f7;padding:3px 8px}
.ws-tabs span{padding:3px 10px;border-radius:5px 5px 0 0;background:#fff;border:1px solid #dde2ea}
.marks-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px}
.marks-grid span{border:1px solid #dfe3ea;border-radius:4px;text-align:center;padding:2px 0;font-size:.7rem}
/* ---------- Round 3: builder ---------- */
.mission{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:14px}
.mission .rq{font-size:1.15rem;font-weight:800}
.mission .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#eef3fd;color:var(--blue);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.target{background:#f8f9fc;border:1px dashed #c8d0de;border-radius:12px;padding:10px;text-align:center}
.target svg{width:100%;height:auto;max-height:150px}
.target small{color:var(--muted)}
.builder{display:grid;grid-template-columns:190px minmax(0,1fr) 250px;gap:14px}
.builder > *{min-width:0}
.drop > .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.marks .mrow > .drop,.shelfrow > .drop{min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.panel h4{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#525c70}
.datapane .grp{margin-bottom:10px}
.datapane .grp > div{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.drop{border:1.5px dashed #cdd4e1;border-radius:10px;min-height:40px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;transition:background .12s,border-color .12s}
.drop.hot{background:#fff8e1;border-color:var(--gold)}
.drop.can{border-color:#97b4e6}
.shelfrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.shelfrow > b{font-size:.82rem;color:#525c70}
.marks .grid{display:grid;grid-template-columns:1fr;gap:6px}
.marks .mrow{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center}
.marks .mrow b{font-size:.78rem;color:#525c70}
.marks .drop{min-height:34px}
.preview{border:1px solid var(--line);border-radius:12px;background:#fff;min-height:210px;display:grid;place-items:center;padding:10px;margin-top:10px}
.preview svg{width:100%;max-width:560px;height:auto}
.preview .empty{color:#9aa3b5;text-align:center}
.showme{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.showme button{border:1px solid #dfe3ea;background:#fafbfd;border-radius:8px;padding:6px 2px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;color:#344}
.showme button svg{width:34px;height:22px}
.showme button.sel{border-color:var(--blue);background:#eaf1fe;box-shadow:0 0 0 2px rgba(47,111,222,.25)}
.analysis{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px;border:1px solid #dfe3ea;border-radius:8px;background:#fafbfd;font-size:.85rem}
.analysis input{width:18px;height:18px}
.menu{position:fixed;z-index:1000;background:#fff;border:1px solid #cfd5e1;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;min-width:220px;font-size:.88rem}
.menu .mh{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 8px}
.menu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:6px;gap:8px;align-items:center}
.menu button:hover{background:#eef3fd}
.menu button.on::before{content:"✓";color:var(--blue);font-weight:800}
.menu button:not(.on)::before{content:"";width:.7em}
.menu hr{border:0;border-top:1px solid #e5e8ef;margin:4px 0}
.hintbox{margin-top:10px;font-size:.92rem}
.hintbox ol{margin:6px 0 0 18px;padding:0}
.answer{margin-top:10px;font-size:.95rem;background:#0f1b33;color:#fff;border-radius:10px;padding:10px 14px}
.answer b{color:var(--gold)}
/* ---------- Round 4: order ---------- */
.olist{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.olist li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.olist li .n{width:26px;height:26px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.olist li .tx{flex:1}
.olist li .mv{display:flex;gap:4px}
.olist li .mv button{border:1px solid #d6dce6;background:#fafbfd;border-radius:6px;width:32px;height:30px}
.olist li.good{border-color:#9fd9b6;background:#f1fbf5}
.olist li.good .n{background:var(--ok);color:#fff}
.olist li.badpos{border-color:#f0b8b8;background:#fff5f5}
/* ---------- End ---------- */
.badge{width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#ffe08a,#f2b632 60%,#c98a12);box-shadow:0 10px 30px rgba(242,182,50,.45);color:var(--navy);text-align:center;font-weight:900}
.badge small{display:block;font-weight:700;font-size:.75rem;letter-spacing:.08em}
.stars{font-size:2rem;letter-spacing:6px;color:var(--gold);text-align:center}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:1001;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* ---------- Responsive ---------- */
@media (max-width:980px){
  .builder{grid-template-columns:1fr}
  .mission{grid-template-columns:1fr}
  .ws-body{grid-template-columns:1fr 1fr}
  .ws-body .ws-col:nth-child(3){grid-column:1 / -1;order:-1}
}
@media (max-width:720px){
  .sorter{grid-template-columns:1fr 1fr}
  .sorter .fieldcard{grid-column:1 / -1;order:-1}
  .hero h1{font-size:1.7rem}
  .hero .bars{display:none}
  main{padding:12px}
}
</style>
</head>
<body>

<div class="hud">
  <div class="logo">Shelf <span>Life</span></div>
  <div class="round" id="hudRound">The Tableau Challenge</div>
  <div class="grow"></div>
  <div class="score">⭐ <span id="hudScore">0</span></div>
  <button class="btn-ghost" id="homeBtn" title="Back to menu">☰ Menu</button>
</div>
<div class="progress"><div id="prog"></div></div>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Shelf Life: The Tableau Challenge  ·  STAT 112 Recitation 6
   Content follows the Recitation 6 Tableau slides (Superstore,
   customer_data.csv, femicide.csv dashboard).
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (tag, attrs={}, html="") => { const e=document.createElement(tag); for(const k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html) e.innerHTML=html; return e; };
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const store = { get(k,d){ try{ const v=localStorage.getItem("shelflife-"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem("shelflife-"+k,JSON.stringify(v)); }catch(e){} } };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }

const state = { score:0, roundScores:[0,0,0,0], mode:"menu", campaign:false };
function addScore(n){ state.score+=n; if(state.cur!=null) state.roundScores[state.cur]+=n; $("#hudScore").textContent=state.score; if(n>0) toast("+"+n+" points"); }
function setProgress(f){ $("#prog").style.width=Math.round(f*100)+"%"; }

/* ---------------------------------------------------------------
   ROUND DATA
   --------------------------------------------------------------- */
const ROUNDS = [
  { key:"sort",  title:"Pill Sorter",     sub:"Dimension or measure? Sort the Data pane.", max:120 },
  { key:"tour",  title:"Workspace Tour",  sub:"Find the right part of the Tableau window.", max:100 },
  { key:"build", title:"Build the View",  sub:"Drag pills onto shelves to answer research questions.", max:300 },
  { key:"order", title:"Step Shuffle",    sub:"Put the Tableau steps in the right order.", max:100 },
];

/* Round 1 — fields */
const FIELDS = [
  { name:"Ship Mode", ic:"Abc", ans:"dim", ctx:"Superstore · Standard, Second, First, Same Day", why:"Ship Mode is categorical, so it sits on the Dimension shelf. Counting it (Measure > Count) gives the new measure CNT(Ship Mode)." },
  { name:"Category", ic:"Abc", ans:"dim", ctx:"Superstore · Furniture, Office Supplies, Technology", why:"Product category is categorical: a dimension. In RQ2 we dropped it on Color to split the bars." },
  { name:"Segment", ic:"Abc", ans:"dim", ctx:"Superstore · Consumer, Corporate, Home Office", why:"Segment is categorical, so it is a dimension (RQ5 pie chart)." },
  { name:"Sales", ic:"#", ans:"mea", ctx:"Superstore · from $0 to $22,638", why:"Sales is numerical: a measure. Tableau aggregates it, e.g. SUM(Sales) or AVG(Sales)." },
  { name:"Profit", ic:"#", ans:"mea", ctx:"Superstore", why:"The slides list profit as a typical measure: a numerical column." },
  { name:"Discount", ic:"#", ans:"mea", ctx:"Superstore · 0 to 0.8", why:"Discount is numerical, so it is a measure. Dragged to Rows it becomes SUM(Discount)." },
  { name:"Quantity", ic:"#", ans:"mea", ctx:"Superstore · items per order line", why:"Quantity is numerical: a measure (x-axis of the RQ4 scatter plot)." },
  { name:"Mean_Sales", ic:"=#", ans:"mea", ctx:"Calculated field: AVG([Sales])", why:"A calculated field built from AVG([Sales]) appears under Measures; the = sign marks it as calculated." },
  { name:"gender", ic:"Abc", ans:"dim", ctx:"customer_data.csv · Female / Male", why:"gender is text, so it is a dimension (one histogram panel per gender)." },
  { name:"education", ic:"Abc", ans:"dim", ctx:"customer_data.csv · High School … PhD", why:"education is categorical: a dimension (the donut chart in Part 2)." },
  { name:"income", ic:"#", ans:"mea", ctx:"customer_data.csv · annual income", why:"income is numerical: a measure. In RQ3 we switched it from SUM to Average." },
  { name:"country", ic:"🌐", ans:"dim", ctx:"customer_data.csv · Geographic type", why:"country is a geographic dimension: Tableau generates latitude and longitude from it for maps." },
  { name:"spending (as loaded)", ic:"Abc", ans:"dim", ctx:"customer_data.csv · Tableau read it as text!", why:"Trap! spending loads as text (Abc), and text fields are dimensions. Fix it: Abc icon → Number (decimal), then right-click → Convert to Measure." },
  { name:"purchase_frequency (fixed)", ic:"#", ans:"mea", ctx:"customer_data.csv · after Number (decimal) + Convert to Measure", why:"After changing the type to Number (decimal) and converting it, purchase_frequency is a measure (Size and Color of the bubble plot)." },
];

/* Round 2 — hotspots */
const TOUR = [
  { q:"You want to include or exclude data, e.g. keep only some ship modes.", hs:"filters", why:"The Filters shelf chooses which data to include and exclude." },
  { q:"Change the color, size, label or tooltip of the marks.", hs:"marks", why:"The Marks card controls color, size, shape, path, label and tooltip." },
  { q:"Oops! Go back one step after a mistake.", hs:"undo", why:"Undo (left arrow in the toolbar, or Ctrl/Cmd+Z) reverts the last step." },
  { q:"Get suggested chart types for the fields you selected.", hs:"showme", why:"The Show Me panel suggests suitable visuals for the chosen variables." },
  { q:"Join pages and create animations.", hs:"pages", why:"The Pages shelf is used for joining pages and creating animations." },
  { q:"Find categorical fields such as Category, Segment or Ship Mode.", hs:"dims", why:"The Dimension shelf holds the categorical columns." },
  { q:"Find numerical fields such as Sales, Profit or Discount.", hs:"meas", why:"The Measure shelf holds the numerical columns." },
  { q:"Turn vertical bars into horizontal bars with one click.", hs:"swap", why:"Swap Rows and Columns in the toolbar flips the bars." },
  { q:"Uncheck Aggregate Measures, or create a calculated field.", hs:"analysis", why:"Both live in the Analysis menu." },
  { q:"Go back to the data connection to edit it.", hs:"datasource", why:"The Data Source tab at the bottom left brings you back to the connection." },
  { q:"Make the whole chart fit on screen (Entire View).", hs:"fit", why:"The fit menu in the toolbar: Standard, Fit Width, Fit Height, Entire View." },
  { q:"Return to the start screen to add another data source.", hs:"home", why:"The Tableau icon in the toolbar brings you back to the start screen." },
  { q:"Where does the visualization actually appear?", hs:"canvas", why:"The worksheet (canvas) is where the chart appears." },
  { q:"Show the Summary card with mean, median, quartiles and skewness.", hs:"cards", why:"Show/Hide Cards in the toolbar → tick Summary." },
  { q:"Open the calculation editor from a field's own dropdown menu (Create › Calculated Field).", hs:"meas", alt:["dims"], why:"Click a field's dropdown in the Data pane → Create > Calculated Field; you get the same editor as Analysis > Create Calculated Field." },
];

/* Round 3 — missions.
   Spec keys: "<pill>:<agg>[:pct]" or "<pill>:F=<filter option>".
   An array inside a shelf list means "any of these". */
const CHARTS = [
  ["text","Text table"],["vbar","Vertical bars"],["hbar","Horizontal bars"],["stacked","Stacked bars"],
  ["side","Side-by-side bars"],["pie","Pie chart"],["line","Line"],["hist","Histogram"],
  ["box","Box-and-whisker"],["scatter","Scatter plot"],["map","Filled map"],["symbol","Symbol map"]
];
const SHELVES = ["Columns","Rows","Filters","Color","Size","Label","Detail","Angle"];

const MISSIONS = [
  { tag:"Superstore · RQ1", rq:"How are orders distributed across ship modes?",
    brief:"Build a vertical bar chart with one bar per ship mode, where the bar height is the number of orders.",

/* ---------------------------------------------------------------
   DRAG & DROP (pointer events, works with mouse + touch)
   Also supports tap-to-select then tap-a-target.
   --------------------------------------------------------------- */
const DnD = { sel:null, onDrop:null };
function makeDraggable(node, payload){
  node.addEventListener("pointerdown", e => {
    if(e.button>0) return;
    const sx=e.clientX, sy=e.clientY; let ghost=null, moved=false;
    const move = ev => {
      if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 6){
        moved=true; ghost=node.cloneNode(true); ghost.classList.add("ghost"); document.body.appendChild(ghost);
        $$("[data-drop]").forEach(d=>d.classList.add("can"));
      }
      if(moved){ ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
        $$("[data-drop]").forEach(d=>d.classList.remove("hot"));
        const t=document.elementFromPoint(ev.clientX, ev.clientY); const d=t && t.closest("[data-drop]"); if(d) d.classList.add("hot"); }
    };
    const up = ev => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      $$("[data-drop]").forEach(d=>d.classList.remove("hot","can"));
      if(moved){ ghost.remove();
        const t=document.elementFromPoint(ev.clientX, ev.clientY); const d=t && t.closest("[data-drop]");
        if(d && DnD.onDrop) DnD.onDrop(payload, d.getAttribute("data-drop"));
        clearSel();
      } else {
        // tap = select
        if(DnD.sel && DnD.sel.node===node){ clearSel(); return; }
        clearSel(); DnD.sel={node,payload}; node.classList.add("selected");
        $$("[data-drop]").forEach(d=>d.classList.add("can"));
      }
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
}
function clearSel(){ if(DnD.sel){ DnD.sel.node.classList.remove("selected"); DnD.sel=null; } $$("[data-drop]").forEach(d=>d.classList.remove("can")); }
document.addEventListener("click", e => {
  const d=e.target.closest("[data-drop]");
  if(d && DnD.sel && !e.target.closest(".pill.on-shelf")){ const p=DnD.sel.payload; clearSel(); if(DnD.onDrop) DnD.onDrop(p, d.getAttribute("data-drop")); }
});

    else { tries++; h.classList.add("wrong");

        $("#fb").innerHTML=`<div class="feedback bad"><b>Here it is (yellow).</b> ${q.why} <div style="margin-top:8px"><button class="btn" id="nx">${k<qs.length-1?"Next ▶":"Finish round"}</button></div></div>`; $("#nx").onclick=next; }
      else { $("#fb").innerHTML=`<div class="feedback bad">Not there. One more try!</div>`; setTimeout(()=>h.classList.remove("wrong"),700); }
    }
  }));
  keyHandler=null; show();
}

/* ---------------- ROUND 3: Build the View ---------------- */
let B=null; // builder state
function roundBuild(){

        </div></div>

    m.pills.forEach(([id,name,kind,ic]) => {

      makeDraggable(p, {id,name,kind,ic});
    });
    DnD.onDrop = (p, shelf) => { if(B.solved) return; addPill(p, shelf); };
    $$(".showme button").forEach(b => b.onclick = () => { if(B.solved) return; B.chart=b.dataset.chart; $$(".showme button").forEach(x=>x.classList.toggle("sel",x===b)); render(); });
    $("#aggBox").onchange = e => { B.agg=e.target.checked; for(const s of SHELVES) B.shelves[s].forEach(it=>{ if(it.kind==="mea"){ if(!B.agg && it.agg!=="BIN") it.agg="raw"; else if(B.agg && it.agg==="raw") it.agg="SUM"; } }); render(); };

let B_next=null;
function defaultAgg(p, shelf){
  if(shelf==="Filters") return "F";
  if(p.kind==="mea") return B.agg ? "SUM" : "raw";
  if(p.ic==="📅") return "YEAR";
  return "dim";
}
function addPill(p, shelf){
  const it={ uid:++B.uid, id:p.id, name:p.name, kind:p.kind, ic:p.ic, agg:defaultAgg(p,shelf), pct:false, filter:null };
  if(shelf==="Filters"){ const opts=(B.m.filters||{})[p.id]; it.filter = opts?opts[0]:"All values"; }
  B.shelves[shelf].push(it); render();
}
function pillLabel(it){
  const n=it.name;
  if(it.agg==="F") return `${n}${it.filter && it.filter!=="All values" ? ` <span class="pct">${it.filter.replace(" by income","").replace(/\s*\(.*\)/,"")}</span>`:""}`;
  if(it.agg==="dim"||it.agg==="raw") return n;
  if(it.agg==="BIN") return `${n} (bin)`;
  return `${it.agg}(${n})${it.pct?' <span class="pct">Δ %</span>':""}`;
}
function render(){
  for(const s of SHELVES){
    const z=$(`[data-drop="${s}"]`); if(!z) continue; z.innerHTML="";
    B.shelves[s].forEach(it => {
      const kindNow = (it.agg==="CNT"||it.agg==="SUM"||it.agg==="AVG"||it.agg==="raw") ? "mea" : (it.agg==="F"? it.kind : "dim");
      const icNow = (it.agg==="CNT") ? "#" : it.ic;
      const p=el("span",{class:`pill on-shelf ${kindNow}`,title:pillLabel(it).replace(/<[^>]+>/g,"")},`<span class="ic">${icNow}</span>${pillLabel(it)} ▾`);
      p.onclick = e => { e.stopPropagation(); if(B.solved) return; if(DnD.sel){ const pl=DnD.sel.payload; clearSel(); addPill(pl, s); return; } openMenu(e, it, s); };
      z.appendChild(p);
    });
  }
  const worth=Math.max(10, 30 - 10*B.fails - 10*B.hints);
  if($("#worth")) $("#worth").textContent = B.solved ? "" : `Worth ${worth} points now`;
  drawPreview();
}
/* pill context menu */
let menuEl=null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } }
document.addEventListener("pointerdown", e => { if(menuEl && !menuEl.contains(e.target)) closeMenu(); });
function openMenu(e, it, shelf){
  closeMenu(); clearSel();
  const m=el("div",{class:"menu"}); const add=(label,on,fn)=>{ const b=el("button",{class:on?"on":""},label); b.onclick=()=>{ fn(); closeMenu(); render(); }; m.appendChild(b); };
  const hr=()=>m.appendChild(el("hr"));
  m.appendChild(el("div",{class:"mh"},it.name+" on "+shelf));
  if(shelf==="Filters"){
    const opts=(B.m.filters||{})[it.id]||["All values"];
    m.appendChild(el("div",{class:"mh"},"Filter › Top tab"));
    opts.forEach(o=>add(o, it.filter===o, ()=>it.filter=o));
  } else if(it.kind==="dim"){
    if(it.ic==="📅") add("YEAR (date part)", it.agg==="YEAR", ()=>{it.agg="YEAR"; it.pct=false;});
    else add("Dimension", it.agg==="dim", ()=>{it.agg="dim"; it.pct=false;});
    add("Measure › Count", it.agg==="CNT", ()=>it.agg="CNT");
  } else {
    if(B.agg){
      add("Measure › Sum", it.agg==="SUM", ()=>it.agg="SUM");
      add("Measure › Average", it.agg==="AVG", ()=>it.agg="AVG");
      add("Measure › Count", it.agg==="CNT", ()=>it.agg="CNT");
    } else {
      add("Disaggregated (one mark per row)", it.agg==="raw", ()=>it.agg="raw");
    }
    add("Create › Bins (histogram)", it.agg==="BIN", ()=>{it.agg="BIN"; it.pct=false;});
  }
  if(it.agg==="CNT"||it.agg==="SUM"){ hr(); add("Quick Table Calculation › Percent of Total", it.pct, ()=>it.pct=!it.pct); }
  hr();
  const rm=el("button",{},"✕ Remove"); rm.onclick=()=>{ B.shelves[shelf]=B.shelves[shelf].filter(x=>x!==it); closeMenu(); render(); }; m.appendChild(rm);
  document.body.appendChild(m);
  const r=e.target.closest(".pill").getBoundingClientRect();
  let x=r.left, y=r.bottom+6; const w=240;
  if(x+w>innerWidth-8) x=innerWidth-w-8; m.style.left=Math.max(8,x)+"px"; m.style.top=y+"px";
  const mh=m.getBoundingClientRect().height; if(y+mh>innerHeight-8) m.style.top=Math.max(8,r.top-mh-6)+"px";
  menuEl=m;
}
function keyOf(it){ if(it.agg==="F") return `${it.id}:F=${it.filter}`; return `${it.id}:${it.agg}${it.pct?":pct":""}`; }
function compare(){
  const m=B.m, issues=[]; let missing=[];
  for(const s of SHELVES){
    const want=(m.spec[s]||[]).map(w=>Array.isArray(w)?w:[w]);
    const have=B.shelves[s].map(keyOf);
    const left=[...have];
    want.forEach(alts => { const i=left.findIndex(h=>alts.includes(h)); if(i>=0) left.splice(i,1); else { missing.push({shelf:s, alts}); } });
    left.forEach(h => issues.push(`<b>${s}</b>: <i>${prettyKey(h)}</i> is not needed here.`));
  }
  missing.forEach(x => issues.push(`<b>${x.shelf}</b>: something is missing or set up differently.`));
  if(m.agg!==B.agg) issues.push(m.agg ? "Aggregation: <b>Aggregate Measures</b> should stay ticked here." : "Aggregation: you need one mark per row, so untick <b>Analysis › Aggregate Measures</b>.");
  if(B.chart!==m.chart) issues.push(B.chart ? `Show Me: <i>${chartName(B.chart)}</i> is not the chart this question needs.` : "Show Me: pick a chart type.");
  return { issues, missing };
}
function prettyKey(k){ const [id,rest]=k.split(":"); const p=B.m.pills.find(x=>x[0]===id); const n=p?p[1]:id;
  if(rest && rest.startsWith("F=")) return `${n} filter (${rest.slice(2)})`;
  const parts=k.split(":"); const a=parts[1], pct=parts[2]==="pct";
  if(a==="dim"||a==="raw") return n; if(a==="BIN") return n+" (bin)"; return `${a}(${n})${pct?" as % of total":""}`; }
function check(){
  if(B.solved) return; closeMenu();
  const { issues } = compare();
  if(!issues.length){
    B.solved=true; const pts=Math.max(10, 30-10*B.fails-10*B.hints); addScore(pts);
    $("#fb").innerHTML = `<div class="feedback ok"><b>View built! +${pts}</b><div class="answer"><b>Answer:</b> ${B.m.answer}</div>
      <div style="margin-top:8px"><button class="btn" id="nx">${B.m===MISSIONS[MISSIONS.length-1]?"Finish round":"Next mission ▶"}</button></div></div>`;
    $("#nx").onclick=B_next; render();
  } else {
    B.fails++; render();
    $("#fb").innerHTML = `<div class="feedback bad"><b>Not yet (${issues.length} ${issues.length===1?"issue":"issues"}).</b><ul style="margin:6px 0 0 18px;padding:0">${issues.slice(0,4).map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  }
}
function hint(){
  if(B.solved) return; const h=B.m.hints;
  if(B.hints>=h.length){ toast("No more hints"); return; }
  B.hints++; render();
  $("#hintbox").innerHTML = `<div class="feedback info"><b>Hints</b><ol>${h.slice(0,B.hints).map(x=>`<li>${x}</li>`).join("")}</ol></div>`;
}

/* ---------------- SVG helpers ---------------- */
const PAL=["#3b78c4","#f28e2b","#59a14f","#e15759","#76b7b2","#edc948"];
function chartName(id){ const c=CHARTS.find(c=>c[0]===id); return c?c[1]:id; }
function chartIcon(id, big){
  const W=big?200:34, H=big?110:22, s=big?1:0.17, g=v=>v*s;
  const c1="#3b78c4", c2="#f28e2b", c3="#59a14f";
  const wrap=inner=>`<svg viewBox="0 0 200 110" ${big?"":`width="${W}" height="${H}"`} aria-hidden="true">${inner}</svg>`;
  switch(id){
    case "vbar": return wrap([70,40,30,12].map((h,i)=>`<rect x="${25+i*42}" y="${100-h}" width="28" height="${h}" fill="${c1}" rx="2"/>`).join("")+`<line x1="15" y1="100" x2="190" y2="100" stroke="#888"/>`);
    case "hbar": return wrap([150,90,60,25].map((w,i)=>`<rect x="20" y="${10+i*24}" width="${w}" height="16" fill="${c1}" rx="2"/>`).join("")+`<line x1="20" y1="5" x2="20" y2="105" stroke="#888"/>`);
    case "stacked": return wrap([80,45,35,15].map((h,i)=>{ const x=25+i*42; return `<rect x="${x}" y="${100-h}" width="28" height="${h*.22}" fill="${c1}"/><rect x="${x}" y="${100-h+h*.22}" width="28" height="${h*.58}" fill="${c2}"/><rect x="${x}" y="${100-h*.2}" width="28" height="${h*.2}" fill="${c3}"/>`; }).join("")+`<line x1="15" y1="100" x2="190" y2="100" stroke="#888"/>`);
    case "side": return wrap([0,1,2].map(g=>[50,25,18,8].map((h,i)=>`<rect x="${12+g*62+i*13}" y="${100-h*1.6}" width="11" height="${h*1.6}" fill="${PAL[i]}"/>`).join("")).join("")+`<line x1="8" y1="100" x2="195" y2="100" stroke="#888"/>`);
    case "pie": return wrap(pieSlices(100,55,45,[51.8,30.3,17.9]));
    case "line": return wrap(`<polyline points="15,92 40,85 65,74 90,66 115,58 140,44 165,22 185,40" fill="none" stroke="${c1}" stroke-width="4" stroke-linejoin="round"/>`+`<line x1="10" y1="100" x2="190" y2="100" stroke="#888"/>`);
    case "hist": return wrap([20,55,80,62,40,24,12,6].map((h,i)=>`<rect x="${18+i*21}" y="${100-h}" width="21" height="${h}" fill="${c1}" stroke="#fff"/>`).join("")+`<line x1="15" y1="100" x2="190" y2="100" stroke="#888"/>`);
    case "box": return wrap([60,100,140].map((x,i)=>`<line x1="${x}" y1="${18+i*6}" x2="${x}" y2="${92}" stroke="#555" stroke-width="2"/><rect x="${x-14}" y="${50+i*4}" width="28" height="${30-i*4}" fill="#cfe0f7" stroke="${c1}" stroke-width="2"/><line x1="${x-14}" y1="${66}" x2="${x+14}" y2="${66}" stroke="${c1}" stroke-width="3"/>`).join(""));
    case "scatter": { let o=""; for(let i=0;i<28;i++){ const x=15+((i*53)%170), y=95-((i*37)%80); o+=`<circle cx="${x}" cy="${y}" r="${4+(i%4)*2}" fill="none" stroke="${PAL[i%3]}" stroke-width="2"/>`; } return wrap(o); }
    case "map": return wrap(`<path d="M20,40 L55,22 L90,30 L95,60 L60,78 L25,70Z" fill="#9fc0ea" stroke="#fff" stroke-width="3"/><path d="M95,30 L140,18 L178,40 L170,80 L120,90 L95,60Z" fill="#2f6fde" stroke="#fff" stroke-width="3"/><path d="M60,78 L95,60 L120,90 L80,100Z" fill="#cfe0f7" stroke="#fff" stroke-width="3"/>`);
    case "symbol": return wrap(`<path d="M20,40 L55,22 L90,30 L95,60 L60,78 L25,70Z M95,30 L140,18 L178,40 L170,80 L120,90 L95,60Z" fill="#eef1f6" stroke="#ccc"/><circle cx="60" cy="50" r="14" fill="${c2}" opacity=".8"/><circle cx="135" cy="55" r="8" fill="${c2}" opacity=".8"/><circle cx="110" cy="80" r="5" fill="${c2}" opacity=".8"/>`);
    case "text": return wrap(`${[0,1,2,3].map(i=>`<rect x="20" y="${12+i*22}" width="160" height="20" fill="${i%2?"#fff":"#f1f4f9"}"/><text x="28" y="${26+i*22}" font-size="12" fill="#555">Abc</text><text x="172" y="${26+i*22}" font-size="12" fill="#555" text-anchor="end">00.0%</text>`).join("")}`);

function pieSlices(cx,cy,r,vals,labels){
  const tot=vals.reduce((a,b)=>a+b,0); let a0=-Math.PI/2, out="";
  vals.forEach((v,i)=>{ const a1=a0+2*Math.PI*v/tot, large=a1-a0>Math.PI?1:0;
    out+=`<path d="M${cx},${cy} L${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} A${r},${r} 0 ${large} 1 ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)}Z" fill="${PAL[i]}" stroke="#fff" stroke-width="2"/>`;
    if(labels){ const am=(a0+a1)/2; out+=`<text x="${cx+r*0.62*Math.cos(am)}" y="${cy+r*0.62*Math.sin(am)}" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle">${labels[i]}</text>`; }
    a0=a1; });
  return out;
}

function axis(x0,y0,x1,y1){ return `<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#999"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="#999"/>`; }

  if(id==="rq6"){ const d=[["Furniture",0,.2,.3,.7,[]],["Office Supplies",0,.2,.2,.45,[.6,.7,.8]],["Technology",0,.2,.2,.45,[.5,.7]]]; const Y=v=>220-v*230;
    s+=axis(60,20,540,220); [0,.2,.4,.6,.8].forEach(v=>s+=T(30,Y(v)+4,v.toFixed(1)));

    s+=T(20,15,"Discount"); }
  if(id==="c1"){ const f=[30,70,95,110,100,85,62,40,22,10], m=[28,72,98,105,98,88,60,38,24,9];
    [["Female",f,60],["Male",m,310]].forEach(([n,a,x0],g)=>{ s+=axis(x0,30,x0+220,210); a.forEach((v,i)=>s+=`<rect x="${x0+2+i*21.5}" y="${210-v*1.5}" width="21" height="${v*1.5}" fill="${PAL[g]}" stroke="#fff"/>`); s+=T(x0+110,22,n,'text-anchor="middle" font-weight="700"')+T(x0+110,230,"spending (bin), 0 to 25K",'text-anchor="middle"'); }); }
  if(id==="c3"){ const names=["Saint Helena","Uzbekistan","Dominica","Indonesia","Slovakia","…","…","…","…","…"], v=[95,93,91,89,88,86.5,85.5,84.5,83.7,83];
    s+=axis(60,20,540,200); v.forEach((h,i)=>{ const hh=(h-60)/35*170, x=72+i*46; const col=`hsl(215,70%,${70-(h-83)*2.6}%)`; s+=`<rect x="${x}" y="${200-hh}" width="34" height="${hh}" fill="${col}" rx="2"/>`+`<text x="${x+17}" y="214" font-size="10" fill="#444" text-anchor="end" transform="rotate(-35 ${x+17} 214)">${names[i]}</text>`; });
    s+=T(20,15,"AVG(income), top 10 (axis cut)"); }
  if(id==="c4"){ s+=axis(60,20,540,220); let seed=7; const r=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
    for(let i=0;i<160;i++){ const pf=r(), x=70+Math.min(460,(pf*0.75+r()*0.3)*440), y=30+r()*180; s+=`<circle cx="${x}" cy="${y}" r="${3+pf*8}" fill="none" stroke="hsl(215,70%,${80-pf*55}%)" stroke-width="2"/>`; }
    s+=T(300,245,"spending →",'text-anchor="middle"')+T(15,15,"income ↑")+T(540,15,"darker / bigger = more frequent buyer",'text-anchor="end"'); }
  if(id==="c5"){ const tiles=[[0,0,.3],[1,0,.6],[2,0,.2],[3,0,.9],[4,0,.4],[0,1,.7],[1,1,.1],[2,1,.5],[3,1,.8],[4,1,.3],[5,1,.6],[1,2,.95],[2,2,.4],[3,2,.2],[4,2,.7],[5,2,.5],[2,3,.6],[3,3,.85],[4,3,.15]];
    tiles.forEach(([c,r,v])=>{ const x=110+c*58+(r%2)*29, y=25+r*50; s+=`<path d="M${x},${y} l25,14 v28 l-25,14 l-25,-14 v-28z" fill="hsl(215,70%,${88-v*55}%)" stroke="#fff" stroke-width="2"/>`; });
    s+=T(280,250,"Schematic filled map · darker = higher average income (22.8K to 94.6K)",'text-anchor="middle"'); }
  if(id==="f1"){ const yrs=[2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020], v=[70,110,180,190,210,240,290,300,330,410,440,470,300];
    s+=axis(60,20,540,220); const X=i=>75+i*36, Y=c=>220-c/500*190; s+=`<polyline points="${v.map((c,i)=>X(i)+","+Y(c)).join(" ")}" fill="none" stroke="#3b78c4" stroke-width="3"/>`; v.forEach((c,i)=>s+=`<circle cx="${X(i)}" cy="${Y(c)}" r="5" fill="#3b78c4"/>`);
    yrs.forEach((y,i)=>{ if(i%2===0) s+=T(X(i),238,y,'text-anchor="middle"'); }); [100,400].forEach(c=>s+=T(25,Y(c)+4,c)+`<line x1="60" y1="${Y(c)}" x2="540" y2="${Y(c)}" stroke="#eee"/>`); s+=T(20,15,"CNT(year), schematic"); }
  if(id==="f4"){ const rows=[["Firearm","46.2%"],["Cutting tool","26.3%"],["Undetectable","9.2%"],["…","…"]];
    s+=`<rect x="90" y="25" width="380" height="28" fill="#0f1b33"/>`+T(105,44,"killingway1",'fill="#fff" font-weight="700"')+T(455,44,"% of Total",'fill="#fff" font-weight="700" text-anchor="end"');
    rows.forEach(([a,b],i)=>{ s+=`<rect x="90" y="${53+i*32}" width="380" height="32" fill="${i%2?"#fff":"#f1f4f9"}"/>`+T(105,74+i*32,a)+T(455,74+i*32,b,'text-anchor="end" font-weight="700"'); }); }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Solved chart">${s}</svg>`;
}

/* ---------------- ROUND 4: Step Shuffle ---------------- */
function roundOrder(){
  const seqs = ORDERS; let k=0;
  const load = () => {
    setProgress(k/seqs.length);
    const S=seqs[k]; let order = shuffle(S.steps.map((t,i)=>({t,i}))); if(order.every((o,i)=>o.i===i)) order.reverse();
    let tries=0, done=false;
    app.innerHTML = `<div class="card" style="max-width:820px;margin:0 auto"><h2>Round 4 · Step Shuffle</h2>
      <p class="muted">Sequence ${k+1} of ${seqs.length}. Use ▲ ▼ to put the steps in order, then check. First try: 20 points, second: 10.</p>
      <h3>${S.title}</h3><ul class="olist" id="ol"></ul>
      <div class="row"><button class="btn" id="chk">✔ Check order</button></div><div id="fb"></div></div>`;
    const draw = (marks) => { const ol=$("#ol"); ol.innerHTML="";
      order.forEach((o,pos)=>{ const li=el("li",{class: marks? (o.i===pos?"good":"badpos"):""},`<span class="n">${pos+1}</span><span class="tx">${o.t}</span><span class="mv"><button aria-label="Move up" ${pos===0||done?"disabled":""}>▲</button><button aria-label="Move down" ${pos===order.length-1||done?"disabled":""}>▼</button></span>`);
        const [u,d]=$$("button",li); u.onclick=()=>{ [order[pos-1],order[pos]]=[order[pos],order[pos-1]]; draw(); }; d.onclick=()=>{ [order[pos+1],order[pos]]=[order[pos],order[pos+1]]; draw(); };
        ol.appendChild(li); }); };
    draw();
    $("#chk").onclick = () => {
      if(done) return; const ok=order.every((o,pos)=>o.i===pos);
      if(ok){ done=true; addScore(tries===0?20:10); draw(true); $("#chk").disabled=true;
        $("#fb").innerHTML=`<div class="feedback ok"><b>Perfect order!</b><div style="margin-top:8px"><button class="btn" id="nx">${k<seqs.length-1?"Next sequence ▶":"Finish round"}</button></div></div>`; $("#nx").onclick=()=>{ k++; k<seqs.length?load():finishRound(); }; }
      else { tries++; draw(true);
        if(tries>=2){ done=true; order=S.steps.map((t,i)=>({t,i})); draw(true); $("#chk").disabled=true;
          $("#fb").innerHTML=`<div class="feedback bad"><b>Here is the correct order.</b><div style="margin-top:8px"><button class="btn" id="nx">${k<seqs.length-1?"Next sequence ▶":"Finish round"}</button></div></div>`; $("#nx").onclick=()=>{ k++; k<seqs.length?load():finishRound(); }; }
        else $("#fb").innerHTML=`<div class="feedback bad">Green steps are in the right place. Fix the red ones and check again.</div>`; }
    };
    keyHandler=null;
  };
  load();
}

screenMenu();
